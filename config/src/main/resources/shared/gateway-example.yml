server:
  port: 8222

spring:
  application:
    name: gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: task-service
          uri: http://task-service:8050
          predicates:
            - Path=/task/**
        - id: auth-service
          uri: http://auth-service:8090
          predicates:
            - Path=/auth/**
        - id: project-service
          uri: http://project-service:8070
          predicates:
            - Path=/project/**

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
